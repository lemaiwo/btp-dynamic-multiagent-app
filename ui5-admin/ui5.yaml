specVersion: "3.0"
metadata:
  name: com.infrabel.agentadmin
type: application
framework:
  name: SAPUI5
  version: "1.120.20"
  libraries:
    - name: sap.m
    - name: sap.ui.core
    - name: sap.f
    - name: sap.tnt
    - name: sap.ui.layout
    - name: themelib_sap_horizon
builder:
  resources:
    excludes:
      - "/test/**"
      - "/localService/**"
  customTasks:
    - name: ui5-tooling-transpile-task
      afterTask: replaceVersion
  bundles:
    - bundleDefinition:
        name: com/infrabel/agentadmin/Component-preload.js
        defaultFileTypes: [".js", ".fragment.xml", ".view.xml", ".properties", ".json"]
        sections:
          - mode: preload
            filters:
              - "com/infrabel/agentadmin/"
              - "!com/infrabel/agentadmin/vendor/mermaid.min.js"
              - "!com/infrabel/agentadmin/test/"
            resolve: true
          - mode: require
            filters: ["ui5loader-autoconfig.js"]
