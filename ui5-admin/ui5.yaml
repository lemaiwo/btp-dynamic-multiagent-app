specVersion: "3.0"
metadata:
  name: com.infrabel.agentadmin
type: application
framework:
  name: SAPUI5
  version: "1.120.20"
  libraries:
    - name: sap.m
    - name: sap.ui.core
    - name: sap.f
    - name: sap.tnt
    - name: sap.ui.layout
    - name: sap.suite.ui.commons
    - name: themelib_sap_horizon
builder:
  resources:
    excludes:
      - "/test/**"
      - "/localService/**"
  customTasks:
    - name: ui5-tooling-transpile-task
      afterTask: replaceVersion
    # Produces dist/ui5-admin-content.zip, which mta.yaml's
    # `ui5-admin-deployer` module names in its `artifacts` list. `ui5 build`
    # alone emits loose files and no archive, so without this the deployer
    # packages an EMPTY resources/ folder and the HTML5 Application Repository
    # rejects the upload with "Could not find applications in the request" —
    # while `mbt build` still exits 0. xs-app.json must be listed here because
    # the repository reads each app's routes from inside its own archive.
    - name: ui5-task-zipper
      afterTask: generateVersionInfo
      configuration:
        archiveName: ui5-admin-content
        additionalFiles:
          - xs-app.json
  # `resolve: false` is load-bearing. With `resolve: true` the builder follows
  # each app module's dependencies and inlines SAPUI5's own modules into
  # Component-preload.js -- 499 of 517 modules, when this was last measured.
  # The app then runs framework JS frozen at BUILD time against framework CSS
  # fetched at SERVE time, and the two drift apart the moment SAPUI5 renames a
  # CSS class. That is not theoretical: sap.tnt renamed `.sapTntNavLI` to
  # `.sapTntNL` after 1.120, and the deployed admin's side navigation collapsed
  # into an unstyled bulleted list. Keep the framework out of the bundle and let
  # the version-pinned /resources/ route in xs-app.json supply all of it.
  # Guarded by tests/test_ui5_asset_versioning.mjs.
  bundles:
    - bundleDefinition:
        name: com/infrabel/agentadmin/Component-preload.js
        defaultFileTypes: [".js", ".fragment.xml", ".view.xml", ".properties", ".json"]
        sections:
          - mode: preload
            filters:
              - "com/infrabel/agentadmin/"
              - "!com/infrabel/agentadmin/vendor/mermaid.min.js"
              - "!com/infrabel/agentadmin/test/"
            resolve: false
          - mode: require
            filters: ["ui5loader-autoconfig.js"]
