apiSlugPlaceholder=<slug>
#XFLD: Toggle - skip items an earlier run already completed
skipSeenItems=Skip items already seen
#YMSG: hint for skipSeenItems
skipSeenItemsHint=An item already completed by an earlier run is skipped, so a retry after a crash resumes instead of re-drafting.
#XFLD: How many items may run in parallel
maxParallelItems=Max parallel items
#XFLD: What to do when the fan-out step selects a branch the workflow does not declare
onUnknownBranch=On unknown branch
#XSEL: on_unknown_branch = "fail" -- agents/workflow_runner.py raises _WorkflowError,
# which fails only that item (finish_item_run(status="failed")); the run itself
# continues and ends "partial", it is not failed.
onUnknownBranchFail=Fail that item
#XSEL: on_unknown_branch = "skip" -- agents/workflow_runner.py hits `continue`,
# dropping only the unrecognised branch key; the item still runs and is never
# itself skipped.
onUnknownBranchSkip=Ignore the unknown branch

