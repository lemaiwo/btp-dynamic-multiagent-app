specVersion: "3.0"
metadata:
  name: com.infrabel.agentadmin
type: application
framework:
  name: SAPUI5
  version: "1.120.20"
  libraries:
    - name: sap.m
    - name: sap.ui.core
    - name: sap.f
    - name: sap.tnt
    - name: sap.ui.layout
    - name: themelib_sap_horizon
server:
  customMiddleware:
    - name: ui5-tooling-transpile-middleware
      afterMiddleware: compression
    - name: ui5-middleware-simpleproxy
      afterMiddleware: compression
      mountPath: /backend
      configuration:
        baseUri: "http://127.0.0.1:7932/admin/api"
