#XTIT: heading of the tool call list in the activity panel
activityTools=Tool calls
#XMSG: no plan in the activity panel
activityNoTodos=The assistant has not made a plan.
#XMSG: no tool calls in the activity panel
activityNoTools=No tool calls yet.
#XBUT: shows a tool call's output in full
activityShowMore=Show full output
#XBUT: folds a tool call's output
activityShowLess=Show less

#XBUT: generic save and close
