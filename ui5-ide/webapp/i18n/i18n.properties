#XTIT: application title, shown in the header and the browser tab
appTitle=ABAP Workbench
#YDES: application description
appDescription=Read, design, plan and review ABAP changes with an AI assistant

#XFLD: header placeholder while no session is open
noSessionTitle=No session open
#XFLD: header placeholder while no target system is chosen
noTarget=No target
#XTOL: tooltip of the target system shown in the header
targetTooltip=Target system

#XTIT: heading of the explorer pane (also its accessible name)
explorerTitle=Explorer
#XTIT: heading of the session list
sessionsTitle=Sessions
#XTOL: tooltip of the icon-only button that creates a session
newSessionTooltip=New session
#XTOL: tooltip of the icon-only button that deletes the selected session
deleteSessionTooltip=Delete session
#YMSG: empty session list
noSessions=No sessions yet. Create one to start.
#XFLD: label of a session's target system in the list
sessionTarget=Target: {0}
#XTIT: heading of the workspace tree
workspaceTitle=Workspace
#YMSG: empty workspace tree
noFiles=No files yet. Open an ABAP object to read it into the workspace.
#XFLD: placeholder of the search field that opens an ABAP object
openObjectPlaceholder=Open object...
#XFLD: accessible name of the open-object search field
openObjectLabel=Open object
#XTOL: tooltip of the open-object search field
openObjectTooltip=Search an ABAP object to read into the workspace

#XFLD: stage names
stageChat=Chat
stageDesign=Design
stagePlan=Plan
stagePropose=Propose
stageReview=Review
stageDone=Done

#XFLD: workspace file states (badge texts)
fileStateRead=read
fileStateModified=modified
fileStateNew=new

#XTIT: title of the new-session dialog
newSessionDialogTitle=New Session
#XFLD: label of the session title input
newSessionTitleLabel=Title
#XFLD: placeholder of the session title input
newSessionTitlePlaceholder=What do you want to work on?
#XFLD: label of the target system select
newSessionTargetLabel=Target system
#XBUT: creates the session
create=Create
#XBUT: closes a dialog without changes
cancel=Cancel
#YMSG: validation message when the session title is empty
titleRequired=Enter a title.
#YMSG: validation message when no target is chosen
targetRequired=Choose a target system.

#XTIT: title of the open-object dialog
openObjectDialogTitle=Open ABAP Object
#XFLD: label of the object type select
objectTypeLabel=Object type
#XFLD: label of the object name input
objectNameLabel=Object name
#XFLD: placeholder of the object name input
objectNamePlaceholder=Name or pattern, for example ZCL_*
#XBUT: runs the object search
search=Search
#XBUT: reads the chosen object into the workspace
open=Open
#XTIT: heading of the object search results
searchResultsTitle=Results
#YMSG: empty search results
noSearchResults=No objects found.
#XFLD: package and type of a search hit
objectHitInfo={0} in {1}

#YMSG: confirm before deleting a session; {0} = title
deleteSessionConfirm=Delete the session "{0}" with its messages, artifacts and workspace files?
#YMSG: toast after a session was deleted
sessionDeleted=Session deleted
#YMSG: toast after an object was opened; {0} = path
objectOpened=Opened {0}
#YMSG: generic error prefix; {0} = server detail
requestFailed=The request failed: {0}
#YMSG: the approuter did not forward the SAP user token (HTTP 424)
userTokenRequired=Your SAP user token is missing. Reload the app to sign in again.
#YMSG: ARC-1 reached SAP and SAP refused (HTTP 502); {0} = SAP's message
sapError=SAP refused the request: {0}. Check your SAP user mapping and authorizations.
#YMSG: the approuter session expired (HTTP 401 or a login redirect)
sessionExpired=Your session has expired. Reload the app to sign in again.
#YMSG: the caller lacks the developer role (HTTP 403)
missingRole=You do not have the role for this action. Ask your administrator for the ABAP IDE Developer role.
#YMSG: the read-only guard refused a call (HTTP 403 readonly_refused)
readOnlyRefused=This action is not allowed in the read-only IDE.
#YMSG: the session's request cap is used up (HTTP 429); {0} = server detail
usageExhausted=The usage limit of this session is reached: {0}

#XTIT: heading of the editor pane (also its accessible name)
editorTitle=Editor
#YMSG: editor pane with no open tab
editorEmpty=Select a file in the workspace to open it here. Proposals can be compared with the source in SAP.
#XBUT: menu button listing the session's documents (design, plan, notes, review)
documentsButton=Documents
#XTOL: tooltip of the documents menu button
documentsTooltip=Open a design, plan, note or review of this session
#XBUT: show the source as read from SAP
modeSource=Source
#XBUT: show the proposed source
modeProposed=Proposed
#XBUT: show source and proposal side by side
modeDiff=Diff
#XBUT: lint the proposed source
lintButton=Lint
#XTOL: tooltip of the lint button
lintTooltip=Check the proposed source with SAPLint (offline, nothing is written)
#XBUT: re-read the source from SAP
refreshButton=Refresh from SAP
#XTOL: tooltip of the refresh button
refreshTooltip=Read the object again from SAP; the diff base is updated
#XFLD: diff column headers
diffSourceHeader=Source in SAP
diffProposedHeader=Proposed
#XFLD: accessible caption of the diff table; {0} = file path
diffCaption=Changes in {0}, source in SAP against proposed
#XFLD: label of the document version select
versionLabel=Version
#XFLD: entry of the document version select; {0} = version number
artifactVersion=Version {0}
#XFLD: document kinds
docKindDesign=Design
docKindPlan=Plan
docKindNote=Note
docKindReview=Review
#XFLD: lint summary; {0} = number of findings
lintFindings={0} lint findings
#XFLD: lint summary when SAPLint found nothing
lintClean=No lint findings
#YMSG: toast after a refresh; {0} = path
fileRefreshed=Re-read {0} from SAP
#XFLD: visually hidden header of the diff's change-marker column
diffMarkHeader=Change
#XFLD: visually hidden text of the + marker of an added line
diffAdded=added line
#XFLD: visually hidden text of the minus marker of a removed line
diffRemoved=removed line
#XFLD: visually hidden text of the ~ marker of a changed line
diffChanged=changed line
#XLNK: summary of a folded run of unchanged lines; {0} = number of lines
diffUnchanged={0} unchanged lines
#YMSG: the file is too large or too different to diff
diffTooLarge=File too large to diff — showing Source and Proposed only.

#XTIT: heading of the assistant pane (also its accessible name)
assistantTitle=Assistant
#XFLD: accessible name of the stage bar
stageBarLabel=Stages
#XTOL: stage token tooltips; {0} = stage name
stageTokenDone={0}: done
stageTokenCurrent={0}: current stage
stageTokenUpcoming={0}: upcoming
#XBUT: approves the current stage and moves to the next
approveButton=Approve
#XTOL: tooltip of Approve when it is allowed; {0} = next stage
approveTooltip=Approve and continue with {0}
#XBUT: opens the revise dialog
reviseButton=Revise…
#XTOL: tooltip of Revise when it is allowed
reviseTooltip=Rerun this stage with your feedback
#XBUT: stops the running assistant
stopButton=Stop
#XTOL: tooltip of Stop
stopTooltip=Stop the running answer
#XFLD: usage of the session's model requests; {0} = used, {1} = cap
usageText={0} / {1} requests
#XFLD: accessible name of the chat list
chatListLabel=Conversation
#YMSG: empty chat
chatEmpty=No messages yet. Ask about an ABAP object, or describe the change you want.
#XFLD: placeholder of the chat input
chatPlaceholder=Ask the assistant… (Ctrl+Enter to send)
#XFLD: accessible name of the chat input
chatInputLabel=Message to the assistant
#XBUT: sends the message
sendButton=Send
#XFLD: role labels of chat messages
roleUser=You
roleAssistant=Assistant
#XFLD: a stopped answer
messageCancelled=Stopped
#XFLD: shown while the assistant works before any text arrives
assistantThinking=Working…
#XFLD: the tool the assistant is calling; {0} = tool name
assistantUsingTool=Using {0}…
#YMSG: toast after the run was stopped
runStopped=The answer was stopped.
#XMSG: screen reader announcement when a run starts
announceAnswering=The assistant is answering…
#XMSG: screen reader announcement when the answer is complete
announceAnswerComplete=Answer complete
#XMSG: screen reader announcement when the answer was stopped
announceAnswerStopped=Answer stopped
#YMSG: toast: a document version opened or refreshed behind the current tab; {0} = document kind, {1} = version
docReadyBehind={0} version {1} is ready in its tab.
#YMSG: toast: a newer document version exists while the user reads an older one; {0} = document kind, {1} = version
docNewerVersion={0} version {1} is available; the version you chose stays open.
#YMSG: toast after approve; {0} = new stage
stageApproved=Moved to {0}
#XTIT: title of the revise dialog; {0} = stage
reviseDialogTitle=Revise {0}
#XFLD: label of the revise feedback
reviseFeedbackLabel=What should change?
#XFLD: placeholder of the revise feedback
reviseFeedbackPlaceholder=Describe what to change in this stage's result
#YMSG: validation message for empty feedback
reviseFeedbackRequired=Enter your feedback.
#XBUT: sends the revise feedback
reviseSend=Revise

#YMSG: gate reasons (client mirror of the stage gates) and server refusal codes
gateNoSession=Open or create a session first.
gateInvalidStage=The session is in an unknown stage. Reload the app.
gateStageDone=This session is done. Start a new session for further work.
gateRunInProgress=The assistant is still working on this session. Wait for it or stop it.
gateNeedsDesign=Ask the assistant for a design first: Approve needs a design document.
gateNeedsPlan=Ask the assistant for a plan first: Approve needs a plan document.
gateNeedsReview=Ask the assistant for a review first: Approve needs a review document.
gateNoProposals=Approve needs at least one new or modified workspace file. Ask the assistant to propose the changes.
gateMissingArtifact=This stage has not produced its document yet. Ask the assistant for it first.
gateReviseNotAllowed=Revise is available in the Design, Plan, Propose and Review stages.
gateStageChanged=The session changed in the meantime. It has been reloaded; try again.
#YMSG: cancel answered 409 run_on_other_instance
cancelOtherInstance=The run is on another server instance; it will stop or time out.
#YMSG: stream errors
streamIncomplete=The connection ended before the answer was complete. The session has been reloaded.
runTimeout=The run took too long and was stopped: {0}
runFailed=The run failed. {0}

#XTIT: activity panel header; {0} = tool calls, {1} = todos done, {2} = todos
activityTitle=Activity ({0} tool calls, {1}/{2} todos)
#XTIT: heading of the plan list in the activity panel
activityTodos=Plan
#XFLD: label of a tool call the read-only guard refused
