# Schema 3.2 is the minimum for `hooks` (see the ensure-aicore-resource-group
# hook below). Older deploy services reject the element outright.
_schema-version: "3.2"
ID: pydantic-agent
description: Dynamic multi-agent Pydantic AI application for SAP BTP management
version: 2.7.0

parameters:
  enable-parallel-deployments: true
  # AI Core bills consumption per resource group, so a landscape that needs its
  # own line in the bill overrides this in an extension descriptor
  # (cf deploy ... -e elia.mtaext) rather than by editing this file.
  # "default" is the tenant-wide group: it always exists, and the deploy hook
  # treats it as "nothing to provision".
  #
  # Deployments are scoped per group. Pointing a landscape at a fresh group
  # gives it an AI Core with no models until scripts/deploy_claude.py has run
  # against that group -- the hook creates the group, nothing more.
  aicore-resource-group: default

modules:
  - name: pydantic-agent
    type: python
    path: .
    build-parameters:
      builder: custom
      commands: []
      ignore:
        - ".venv/"
        - ".git/"
        - "__pycache__/"
        - "*.pyc"
        - ".env"
        - ".tokens.json"
        - ".tokens-*.json"
        - "agents_registry.db"
        - "node_modules/"
        - "package.json"
        - "package-lock.json"
        - "mta_archives/"
        - "*.mtar"
        - "approuter/"
        - "ui5-admin/"
    parameters:
      memory: 1G
      disk-quota: 2G
      buildpack: python_buildpack
      command: python -m uvicorn app:app --host 0.0.0.0 --port $PORT
    properties:
      AICORE_RESOURCE_GROUP: "${aicore-resource-group}"
      # Optional: restrict the set of MCP URLs admins can register.
      # Comma-separated list of URL prefixes. If empty, any BTP URL is allowed.
      MCP_URL_ALLOWLIST: ""
      # A2A / Joule integration — the public approuter URL of this app.
      # Joule fetches the agent card from this URL; the card's `url`
      # field is derived from it, so it MUST match the approuter host.
      # Example: https://<org>-<space>-pydantic-agent-approuter.cfapps.eu20-001.hana.ondemand.com
      A2A_PUBLIC_URL: ""
      # Public base URL used to build the OAuth2 redirect_uri for per-user
      # (auth_mode="oauth2") MCP servers: <base>/oauth/callback. Leave empty
      # to fall back to A2A_PUBLIC_URL, then to the approuter's forwarded
      # host headers. Set this only if those are unavailable or incorrect.
      #
      # API-triggered (scheduled) runs have no request to read headers from,
      # so they need one of PUBLIC_BASE_URL / A2A_PUBLIC_URL to be set: with
      # both empty, every run fails immediately in run_as.
      PUBLIC_BASE_URL: "https://infrabel-app-acc-cf-ai-pydantic-agent-approuter.cfapps.eu20-001.hana.ondemand.com"
      A2A_AGENT_NAME: "SAP BTP Multi-Agent Orchestrator"
      A2A_AGENT_DESCRIPTION: "Dynamic multi-agent orchestrator for SAP BTP. Delegates to specialist agents backed by BTP-hosted MCP servers."
    requires:
      - name: aicore-service
      - name: uaa-service
      - name: agent-registry-db
      - name: agent-destination
    provides:
      - name: pydantic-agent-api
        properties:
          url: ${default-url}
      - name: ui5-cdn
        properties:
          url: "https://ui5.sap.com"
    hooks:
      # Create the AI Core resource group named above before the app starts,
      # so a landscape pointed at a dedicated group deploys without a manual
      # step in the AI Core cockpit. Idempotent, and a no-op for "default".
      #
      # The task runs on this module, so it inherits the aicore binding and
      # AICORE_RESOURCE_GROUP. Creating a group needs an aicore key with admin
      # scope: without one the task fails and takes the deploy with it, which
      # is the loud outcome we want. Set AICORE_ENSURE_STRICT=false to downgrade
      # that to a warning when the key is deliberately restricted.
      - name: ensure-aicore-resource-group
        type: task
        phases:
          - deploy.application.before-start
          - blue-green.application.before-start.idle
        parameters:
          name: ensure-aicore-resource-group
          command: python scripts/ensure_aicore_setup.py
          memory: 512M
          disk-quota: 1G

  - name: pydantic-agent-approuter
    type: nodejs
    path: approuter
    parameters:
      memory: 128M
      disk-quota: 256M
      buildpack: nodejs_buildpack
    requires:
      - name: uaa-service
      - name: pydantic-agent-api
        group: destinations
        properties:
          name: pydantic-agent-backend
          url: ~{url}
          forwardAuthToken: true
      - name: ui5-cdn
        group: destinations
        properties:
          name: ui5
          url: ~{url}
          forwardAuthToken: false
      - name: ui5-admin-repo-runtime

  - name: ui5-admin
    type: html5
    path: ui5-admin
    build-parameters:
      builder: custom
      commands:
        - npm ci
        - npm run build:ui5
      supported-platforms: []
      build-result: dist

  - name: ui5-admin-deployer
    type: com.sap.application.content
    path: .
    requires:
      - name: ui5-admin-repo-host
        parameters:
          content-target: true
    build-parameters:
      build-result: resources
      requires:
        - name: ui5-admin
          artifacts:
            - ui5-admin-content.zip
          target-path: resources/

resources:
  - name: aicore-service
    type: org.cloudfoundry.managed-service
    parameters:
      service: aicore
      service-plan: extended

  - name: uaa-service
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: xs-security.json
      config:
        xsappname: pydantic-agent-${space}

  - name: agent-registry-db
    type: org.cloudfoundry.managed-service
    parameters:
      service: postgresql-db
      service-plan: standard
      config:
        # engine_version: "16"          # major version; allowed 13–17
        memory: 2                     # GB; allowed [2, 4]. 2 = smallest (recreate-only)
        # storage: 20                   # GB; grow-only (default/floor is 20)
        multi_az: false               # false = no HA standby (dev). Set true for prod HA.
        # backup_retention_period: 14   # days; allowed 7–35

  - name: ui5-admin-repo-host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-host

  - name: ui5-admin-repo-runtime
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-runtime

  - name: agent-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite
