# Schema 3.2 is the minimum for `hooks` (see the ensure-aicore-resource-group
# hook below). Older deploy services reject the element outright.
_schema-version: "3.2"
ID: pydantic-agent
description: Dynamic multi-agent Pydantic AI application for SAP BTP management
version: 2.23.0

parameters:
  # Sequential on purpose. xs-security.json grants the JOBSCHEDULER scope with
  # $XSSERVICENAME(agent-jobscheduler), which XSUAA resolves against the live
  # space at create time -- so the jobscheduler instance has to exist before
  # uaa-service is processed. In parallel that ordering is a coin toss, and
  # losing it fails the deploy with "Could not find app for XSUAA instance
  # with name 'agent-jobscheduler'". Resource order below does the rest.
  enable-parallel-deployments: false
  # AI Core bills consumption per resource group, so a landscape that needs its
  # own line in the bill overrides this in an extension descriptor
  # (cf deploy ... -e <landscape>.mtaext) rather than by editing this file.
  # "default" is the tenant-wide group: it always exists, and the deploy hook
  # treats it as "nothing to provision".
  #
  # Deployments are scoped per group. Pointing a landscape at a fresh group
  # gives it an AI Core with no models until scripts/deploy_claude.py has run
  # against that group -- the hook creates the group, nothing more.
  aicore-resource-group: default

modules:
  - name: pydantic-agent
    type: python
    path: .
    build-parameters:
      builder: custom
      commands: []
      ignore:
        - ".venv/"
        - ".git/"
        - "__pycache__/"
        - "*.pyc"
        - ".env"
        - ".tokens.json"
        - ".tokens-*.json"
        - "agents_registry.db"
        - "node_modules/"
        - "package.json"
        - "package-lock.json"
        - "mta_archives/"
        - "*.mtar"
        - "Makefile_*.mta"
        - "approuter/"
        - "ui5-admin/"
        - "ui5-ide/"
        # Local-only material: landscape/customer specific or dev tooling.
        # Nothing here is read by app.py, agents/ or the before-start hook.
        - ".sdd/"
        - "docs/"
        - "memory/"
        - "tests/"
        - "e2e/"
        - "test-results/"
        - "tmp/"
        - "resources/"
        - ".claude/"
        - ".mcp.json"
        - ".github/"
        - ".pytest_cache/"
        - ".ruff_cache/"
        - "CLAUDE.md"
        - "CLAUDE.local.md"
        - "README.md"
        - "JOULE_A2A.md"
        - "SLACK_SETUP.md"
        - "*.mtaext"
        - "ruff.toml"
        - "pytest.ini"
        - "*.db"
        - ".env.*"
        - "client_secret_*.json"
        - "*.pfx"
        - "*.p12"
        - "*.pem"
        - "*.key"
    parameters:
      memory: 1G
      disk-quota: 2G
      buildpack: python_buildpack
      command: python -m uvicorn app:app --host 0.0.0.0 --port $PORT
    properties:
      AICORE_RESOURCE_GROUP: "${aicore-resource-group}"
      # Optional: restrict the set of MCP URLs admins can register.
      # Comma-separated list of URL prefixes. If empty, any BTP URL is allowed.
      MCP_URL_ALLOWLIST: ""
      # A2A / Joule integration — the public approuter URL of this app.
      # Joule fetches the agent card from this URL; the card's `url`
      # field is derived from it, so it MUST match the approuter host.
      # Taken from the approuter module's route (see its `provides`), so it
      # is right on every landscape without an extension descriptor. Override
      # in an .mtaext only when a custom domain fronts the approuter.
      A2A_PUBLIC_URL: ~{pydantic-agent-approuter-api/url}
      # Public base URL used to build the OAuth2 redirect_uri for per-user
      # (auth_mode="oauth2") MCP servers: <base>/oauth/callback, and the URL
      # API-triggered (scheduled) runs bind, since they have no request to
      # read a host from.
      #
      # Same source as A2A_PUBLIC_URL. On Cloud Foundry the backend never
      # derives this from X-Forwarded-Host: that header is client-controlled
      # and the value becomes a registered OAuth redirect_uri. With both
      # variables empty on CF, per-user OAuth2 sign-in and scheduled runs
      # fail instead of trusting the header (app.py logs a warning once).
      PUBLIC_BASE_URL: ~{pydantic-agent-approuter-api/url}
      A2A_AGENT_NAME: "SAP BTP Multi-Agent Orchestrator"
      A2A_AGENT_DESCRIPTION: "Dynamic multi-agent orchestrator for SAP BTP. Delegates to specialist agents backed by BTP-hosted MCP servers."
      # ABAP Assistant (agents/ide). Landscape-specific values (ARC-1
      # destination, targets) are set in conventions / an .mtaext, not here.
      IDE_SESSION_RETENTION_DAYS: "90"
      IDE_SESSION_REQUEST_CAP: "1000"
      IDE_ORCHESTRATOR_AGENT: abap-orchestrator
      # Diagnose sessions: values are the code defaults; a landscape
      # overrides them in its .mtaext.
      IDE_DIAGNOSE_AGENT: abap-diagnostics
      IDE_DIAGNOSE_RETENTION_DAYS: "14"
      IDE_AUDIT_RETENTION_DAYS: "365"
      IDE_APPROVAL_TTL_MIN: "15"
      IDE_TRACE_MAX_EXECUTIONS: "3"
      IDE_TRACE_MAX_HOURS: "8"
      IDE_TRACE_ARM_TIMEOUT_S: "60"
      # A landscape turns the IDE seed on in its .mtaext.
      IDE_SEED: "false"
      # --- OData services (builtin:odata) ---
      # Days an odata_audit_log row is kept; 0 keeps them forever.
      ODATA_AUDIT_RETENTION_DAYS: "365"
    requires:
      - name: aicore-service
      - name: uaa-service
      - name: agent-registry-db
      # The SAP HANA alternative to agent-registry-db. The resource is
      # inactive by default, and a requirement on an inactive resource is
      # ignored: nothing is created or bound unless an .mtaext activates it.
      - name: agent-registry-hana
      - name: agent-destination
      # The connectivity proxy for ProxyType OnPremise destinations (Cloud Connector).
      - name: agent-connectivity
      # Listed after uaa-service on purpose: the Job Scheduling Service reads
      # the app's XSUAA binding to mint the token it calls the action endpoint
      # with, so binding it first leaves it with nothing to grant against.
      - name: agent-jobscheduler
      # The approuter's own route, for PUBLIC_BASE_URL / A2A_PUBLIC_URL above.
      # Mutual requires between the two modules are fine: ${default-url} is
      # known before either is deployed, so the deployer resolves both.
      - name: pydantic-agent-approuter-api
    provides:
      - name: pydantic-agent-api
        properties:
          url: ${default-url}
      - name: ui5-cdn
        properties:
          url: "https://ui5.sap.com"
    hooks:
      # Create the AI Core resource group named above before the app starts,
      # so a landscape pointed at a dedicated group deploys without a manual
      # step in the AI Core cockpit. Idempotent, and a no-op for "default".
      #
      # The task runs on this module, so it inherits the aicore binding and
      # AICORE_RESOURCE_GROUP. Creating a group needs an aicore key with admin
      # scope: without one the task fails and takes the deploy with it, which
      # is the loud outcome we want. Set AICORE_ENSURE_STRICT=false to downgrade
      # that to a warning when the key is deliberately restricted.
      - name: ensure-aicore-resource-group
        type: task
        phases:
          - deploy.application.before-start
          - blue-green.application.before-start.idle
        parameters:
          name: ensure-aicore-resource-group
          command: python scripts/ensure_aicore_setup.py
          memory: 512M
          # The task container unpacks the app's whole droplet, so it needs
          # the app's disk quota, not less: at 1G the 2.16.0 deploy failed
          # with "No space left on device" once the droplet reached ~1G.
          disk-quota: 2G

  - name: pydantic-agent-approuter
    type: nodejs
    path: approuter
    parameters:
      memory: 128M
      disk-quota: 256M
      buildpack: nodejs_buildpack
    requires:
      - name: uaa-service
      - name: pydantic-agent-api
        group: destinations
        properties:
          name: pydantic-agent-backend
          url: ~{url}
          forwardAuthToken: true
      - name: ui5-cdn
        group: destinations
        properties:
          name: ui5
          url: ~{url}
          forwardAuthToken: false
      - name: ui5-admin-repo-runtime
    provides:
      - name: pydantic-agent-approuter-api
        properties:
          url: ${default-url}

  - name: ui5-admin
    type: html5
    path: ui5-admin
    build-parameters:
      builder: custom
      commands:
        - npm ci
        - npm run build:ui5
      supported-platforms: []
      build-result: dist

  - name: ui5-ide
    type: html5
    path: ui5-ide
    build-parameters:
      builder: custom
      commands:
        - npm ci
        - npm run build:ui5
      supported-platforms: []
      build-result: dist

  - name: ui5-admin-deployer
    type: com.sap.application.content
    path: .
    requires:
      - name: ui5-admin-repo-host
        parameters:
          content-target: true
    build-parameters:
      build-result: resources
      requires:
        - name: ui5-admin
          artifacts:
            - ui5-admin-content.zip
          target-path: resources/
        - name: ui5-ide
          artifacts:
            - ui5-ide-content.zip
          target-path: resources/

resources:
  - name: aicore-service
    type: org.cloudfoundry.managed-service
    parameters:
      service: aicore
      service-plan: extended

  # Declared before uaa-service, and deliberately so: with parallel deploys
  # off, resources are processed in this order, and xs-security.json's
  # JOBSCHEDULER scope references $XSSERVICENAME(agent-jobscheduler). XSUAA
  # resolves that name against the space as it creates the instance, so this
  # one has to be there first or the whole deploy fails.
  #
  # The jobs themselves are not declared here: they live in the service
  # instance and are managed through its REST API, so a redeploy never
  # silently rewrites a schedule someone tuned by hand.
  - name: agent-jobscheduler
    type: org.cloudfoundry.managed-service
    parameters:
      service: jobscheduler
      service-plan: standard

  - name: uaa-service
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: xs-security.json
      config:
        xsappname: pydantic-agent-${space}

  - name: agent-registry-db
    type: org.cloudfoundry.managed-service
    parameters:
      service: postgresql-db
      service-plan: standard
      config:
        # engine_version: "16"          # major version; allowed 13–17
        memory: 2                     # GB; allowed [2, 4]. 2 = smallest (recreate-only)
        # storage: 20                   # GB; grow-only (default/floor is 20)
        multi_az: false               # false = no HA standby (dev). Set true for prod HA.
        # backup_retention_period: 14   # days; allowed 7–35

  # The same storage on SAP HANA Cloud instead: an HDI container. Off by
  # default; a landscape chooses its database by flipping `active` on the two
  # resources in its extension descriptor (cf deploy ... -e <landscape>.mtaext):
  #
  #   resources:
  #     - name: agent-registry-db
  #       active: false
  #     - name: agent-registry-hana
  #       active: true
  #
  # The app takes whichever of the two is bound. With BOTH active it refuses
  # to start until the extension also sets the module property DB_KIND to
  # "postgres" or "hana". Nothing is copied from one database to the other:
  # a landscape that switches starts with an empty registry (export the
  # configuration in the admin UI first, import it afterwards).
  #
  # There is no deployer module and no .hdbtable file: at start the app
  # generates the design-time artifacts from its models and deploys them
  # with the container's design-time user (agents/hana_hdi.py). The
  # container remembers the schema generation it holds: an OLDER app
  # version (a rollback, an old instance during a rolling deploy) deploys
  # nothing and runs on the newer schema, as it would on PostgreSQL. A
  # table is never dropped unless the extension sets the module property
  # HANA_HDI_ALLOW_DROP to "true" for that one deploy.
  #
  # Needs a HANA Cloud instance mapped to the space; with more than one,
  # name it in the extension: parameters: { config: { database_id: <id> } }.
  - name: agent-registry-hana
    type: org.cloudfoundry.managed-service
    active: false
    parameters:
      service: hana
      service-plan: hdi-shared

  - name: ui5-admin-repo-host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-host

  - name: ui5-admin-repo-runtime
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-runtime

  - name: agent-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite

  - name: agent-connectivity
    type: org.cloudfoundry.managed-service
    parameters:
      service: connectivity
      service-plan: lite
