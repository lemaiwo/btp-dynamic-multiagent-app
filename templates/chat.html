<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/static/sap.png" />
    <link rel="shortcut icon" href="/static/sap.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SAP BTP Multi-Agent</title>
    <script type="module" crossorigin src="https://cdn.jsdelivr.net/npm/@pydantic/ai-chat-ui@1.0.0/dist/assets/index-Dtnbv4I1.js"></script>
    <link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/npm/@pydantic/ai-chat-ui@1.0.0/dist/assets/index-BtNS_N-J.css">
    <script>
      // The chat UI is a React SPA rendered after load. Rebrand by watching
      // for the title <h1> and swapping its logo + text.
      (function () {
        const LOGO_URL = "/static/sap.png";
        const APP_NAME = "SAP BTP Multi-Agent";
        function rebrand() {
          document.querySelectorAll("h1 > span").forEach((span) => {
            if (span.textContent.trim() === "Pydantic AI") {
              span.textContent = APP_NAME;
            }
          });
          document.querySelectorAll("h1 > img").forEach((img) => {
            if (img.getAttribute("src") !== LOGO_URL) {
              img.setAttribute("src", LOGO_URL);
            }
          });
        }
        new MutationObserver(rebrand).observe(document.documentElement, {
          childList: true,
          subtree: true,
        });
        rebrand();

        // MCP sign-in: open the sign-in page in a popup so the chat tab stays
        // alive (the backend polls for the token and continues the answer by
        // itself once the user authorizes — no need to re-send the message).

        // Return the safe sign-in URL for an anchor, or null. Only OUR OWN
        // same-origin /oauth/login is ever opened — chat content is
        // model/MCP-controlled, so a substring match would let an injected link
        // (https://evil/oauth/login, javascript:…) be window.open()'d with
        // window.opener (open redirect / reverse tabnabbing / XSS).
        function signinUrl(a) {
          let u;
          try {
            u = new URL(a.href, location.href);
          } catch (_) {
            return null;
          }
          if (u.origin !== location.origin || u.pathname !== "/oauth/login")
            return null;
          return u.href;
        }
        function openSignin(href) {
          return window.open(href, "mcp_auth", "width=520,height=720");
        }

        // Manual click (a real user gesture → popup is allowed).
        document.addEventListener(
          "click",
          function (e) {
            if (
              e.defaultPrevented ||
              e.button !== 0 ||
              e.metaKey ||
              e.ctrlKey ||
              e.shiftKey ||
              e.altKey
            )
              return;
            const a = e.target.closest && e.target.closest("a[href]");
            if (!a) return;
            const href = signinUrl(a);
            if (!href) return;
            e.preventDefault();
            // Blocked (enterprise policy): navigate instead so they can sign in.
            if (!openSignin(href)) window.location.href = href;
          },
          true,
        );

        // Best-effort AUTO-open when a sign-in link first appears, so the user
        // doesn't have to click. NOTE: browsers block popups without a recent
        // user gesture, so this often won't fire — the visible link remains as
        // the reliable fallback. We never navigate away on the auto path (that
        // would close the chat tab) and only try each distinct link once.
        const autoTried = new Set();
        function autoOpenSignin() {
          const links = document.querySelectorAll('a[href*="/oauth/login"]');
          for (const a of links) {
            const href = signinUrl(a);
            if (!href || autoTried.has(href)) continue;
            autoTried.add(href);
            openSignin(href); // if blocked, the link stays for a manual click
          }
        }
        new MutationObserver(autoOpenSignin).observe(document.documentElement, {
          childList: true,
          subtree: true,
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
